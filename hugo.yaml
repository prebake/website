baseURL: https://prebake.dev/
languageCode: en-us
title: Prebake

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

security:
  http:
    headers:
      contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://cloud.umami.is; img-src 'self' data:; style-src 'self' 'unsafe-inline'"

params:
  description: Turn a bare Kubernetes cluster into a Developer Platform with just two commands.
  externalLinkDecoration: true
  analytics:
    umami:
      serverURL: "https://cloud.umami.is"
      websiteID: "0d6f582d-bae6-4a73-b555-91866d19526d"
      scriptName: "script.js"
  navbar:
    displayLogo: true
    logo:
      path: prebake-icon.svg
      width: 70
      height: 70
  footer:
    displayPoweredBy: false

menu:
  main:
    - name: Discord
      weight: 5
      url: "https://go.nadrama.com/discord"
      params:
        icon: discord
    - name: GitHub
      weight: 10
      url: "https://github.com/prebake/prebake"
      params:
        icon: github
  sidebar:
    - name: GitHub
      url: "https://github.com/prebake/prebake"
      weight: 1

outputs:
  home: [html, llms]